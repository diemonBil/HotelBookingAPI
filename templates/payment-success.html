<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment received &middot; Hotel Booking API</title>
    <style>
        :root { color-scheme: light dark; }
        body {
            font-family: system-ui, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 1.5rem;
            background: #f4f6fb;
            color: #1c2330;
        }
        .box {
            background: #fff;
            padding: 2.5rem;
            border-radius: 12px;
            max-width: 32rem;
            box-shadow: 0 2px 16px rgba(20, 30, 60, 0.12);
        }
        h1 { color: #17803d; margin-top: 0; font-size: 1.5rem; }
        p { line-height: 1.6; }
        a { color: #2557d6; }
        @media (prefers-color-scheme: dark) {
            body { background: #10141c; color: #e6e9f0; }
            .box { background: #182030; box-shadow: none; }
            h1 { color: #4ade80; }
            a { color: #8ab4ff; }
        }
    </style>
</head>
<body>
    <div class="box">
        <h1>Thanks &mdash; your payment went through</h1>
        <p>
            Your booking is confirmed as soon as the provider's webhook reaches us,
            which is usually immediate. You can check the current state of the
            booking at <code>GET /api/v1/bookings/</code>.
        </p>
        <p><a href="/api/v1/docs/">Back to the API documentation</a></p>
    </div>
</body>
</html>
