# Render Blueprint: https://render.com/docs/blueprint-spec
#
# Deploy with: Render dashboard -> New -> Blueprint -> pick this repository.
#
# DATABASE_URL is the one value to supply by hand; everything else is either
# generated by Render or derived at runtime from RENDER_EXTERNAL_HOSTNAME.
#
# The database lives on Neon rather than Render, because Render's free
# PostgreSQL is deleted after 30 days, which is not much use for a link on a CV.

services:
  - type: web
    name: hotel-booking-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/v1/health/
    envVars:
      # Neon connection string; entered once in the dashboard, never committed.
      - key: DATABASE_URL
        sync: false

      # Generated once by Render and kept across deploys.
      - key: DJANGO_SECRET_KEY
        generateValue: true

      - key: DEBUG
        value: "False"

      # ALLOWED_HOSTS, CSRF_TRUSTED_ORIGINS and PUBLIC_BASE_URL are derived
      # from RENDER_EXTERNAL_HOSTNAME in settings.py, so they stay unset here.

      # The offline provider, so the booking flow is demonstrable without a
      # merchant account. Switch to "monobank" and add MONOBANK_TOKEN to take
      # real payments.
      - key: PAYMENT_PROVIDER
        value: fake

      # Populates the demo catalogue on first boot. Idempotent, so leaving it
      # on across deploys is harmless.
      - key: SEED_DEMO_DATA
        value: "true"

      # One worker fits the 512 MB free instance.
      - key: WEB_CONCURRENCY
        value: "1"
